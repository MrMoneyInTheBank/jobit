name: Jobit issue
description: Report a bug or suggest an improvement
body:
  - type: dropdown
    id: kind
    attributes:
      label: Type
      options:
        - Bug
        - Feature request
        - Documentation
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened or what would you like to change?
      description: Include the behavior you expected and why it matters.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce, if this is a bug
      description: Include the command or keys you used and any error text.
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Jobit version, and installation method, if relevant.
    validations:
      required: false
