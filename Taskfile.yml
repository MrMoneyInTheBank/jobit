version: "3"

env:
  CGO_ENABLED: "1"

tasks:
  run-dev:
    desc: Run jobit (JOBIT_DB_DSN overrides the user data path)
    cmds:
      - go run ./cmd/jobit
  run-prod:
    desc: Build and run jobit (JOBIT_DB_DSN overrides the user data path)
    cmds:
      - task: build
      - ./bin/jobit
  build:
    cmds:
      - go build -o bin/jobit ./cmd/jobit
  seed:
    desc: Add 50 sample applications to JOBIT_DB_DSN or the user data path
    cmds:
      - go run ./cmd/seed
  fmt:
    cmds:
      - gofmt -w ./cmd ./internal
  fmt-check:
    cmds:
      - sh scripts/check.sh fmt
  lint:
    desc: Run the Go vet static checks
    cmds:
      - sh scripts/check.sh lint
  test:
    cmds:
      - sh scripts/check.sh test
  check:
    cmds:
      - sh scripts/check.sh all
  hooks:
    desc: Enable repository pre-commit hook
    cmds:
      - git config --local core.hooksPath .githooks
